name: Deploy Dev
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Repo's default_workflow_permissions is "read" (confirmed via the Actions API, not
    # assumed) — GITHUB_TOKEN gets packages: read unless a job explicitly asks for more,
    # which made `docker push` fail with "installation not allowed to Create organization
    # package". Declaring `permissions:` at all resets every unlisted scope to none for this
    # job, so contents: read has to be listed too, or actions/checkout below loses read
    # access to the repo. Scoped to this job only (not workflow-level, not the deploy job,
    # which never pushes packages) — least privilege.
    permissions:
      contents: read
      packages: write
    strategy:
      # Without this, all 4 matrix combinations run as separate concurrent jobs, each doing
      # its own docker login + push under the same GITHUB_TOKEN identity to the same GHCR
      # namespace at roughly the same time — a burst of near-simultaneous requests that has
      # twice tripped GHCR's secondary rate limit right at the final manifest PUT (layers,
      # which are mostly existence-check HEAD requests, succeed fine; the 4 jobs' manifest
      # pushes converge in the same window). Serializing removes the burst pattern entirely.
      # Costs wall-clock time (~4x, sequential instead of parallel) — acceptable for dev CI.
      max-parallel: 1
      matrix:
        include:
          - service: backend/api
            image: api
          - service: backend/worker
            image: worker
          - service: mcp-server
            image: mcp-test-analysis
          - service: frontend
            image: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build image
        run: |
          # ghcr.io (like all OCI registries) requires an all-lowercase repository name;
          # github.repository_owner preserves the GitHub username's actual casing
          # (Sleeman01), which docker build/push reject outright ("repository name must be
          # lowercase"). Lowercase once here rather than hardcoding the owner literally, so
          # this keeps working if the repo is ever renamed or forked under a different owner.
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> "$GITHUB_ENV"
          docker build -t ghcr.io/${OWNER_LC}/testscope-${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.service }}/Dockerfile .
      - name: Push image
        # Bounded retry with exponential backoff, scoped to the push only (build failures are
        # deterministic — retrying a build never helps). GHCR's secondary rate limit is
        # time-windowed ("wait a few minutes"), so a short backoff is usually enough for it to
        # clear on its own — but only for that specific failure. Any other push failure (bad
        # auth, wrong repo, network error) is not something a retry can fix, so the output is
        # inspected and non-rate-limit errors fail immediately instead of burning all 3
        # attempts on an error that will never succeed.
        run: |
          IMAGE="ghcr.io/${OWNER_LC}/testscope-${{ matrix.image }}:${{ github.sha }}"
          MAX_ATTEMPTS=3
          DELAY=30
          attempt=1
          while :; do
            echo "Push attempt ${attempt}/${MAX_ATTEMPTS}: ${IMAGE}"
            if output=$(docker push "$IMAGE" 2>&1); then
              echo "$output"
              echo "Push succeeded on attempt ${attempt}."
              break
            fi
            echo "$output"
            if ! echo "$output" | grep -qi "rate limit"; then
              echo "::error::Push failed with a non-rate-limit error — failing fast, not retrying."
              exit 1
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Still hitting the secondary rate limit after ${MAX_ATTEMPTS} attempts — giving up."
              exit 1
            fi
            echo "Secondary rate limit hit — waiting ${DELAY}s before retry..."
            sleep "$DELAY"
            DELAY=$((DELAY * 2))
            attempt=$((attempt + 1))
          done

  deploy:
    needs: [build-and-push]
    runs-on: [self-hosted, testscope-k8s]
    steps:
      - uses: actions/checkout@v4
      - name: Update image tags and apply
        shell: bash
        # Fixed from plan.md's literal per-image loop: that version re-ran `kubectl kustomize .`
        # fresh on every iteration and overwrote /tmp/rendered.yaml each time, so only the LAST
        # image in the loop (frontend) ever ended up retagged in what actually got applied —
        # confirmed empirically against the real kubernetes/dev kustomize output before writing
        # this fix (api/worker/mcp-test-analysis stayed on the literal `:latest` placeholder).
        # Fix: render once, then chain all four sed substitutions in a single pass.
        run: |
          cd kubernetes/dev
          # Same lowercasing as build-and-push's own step above — ghcr.io tags must be
          # all-lowercase; github.repository_owner preserves actual casing (Sleeman01).
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SED_ARGS=()
          for img in api worker mcp-test-analysis frontend; do
            SED_ARGS+=(-e "s#ghcr.io/testscope-ai/${img}:latest#ghcr.io/${OWNER_LC}/testscope-${img}:${{ github.sha }}#g")
          done
          # Durability fix: without this, every push to main re-applies the checked-in
          # REPLACE_WITH_TERRAFORM_OUTPUT_queue_url placeholder, reverting any live kubectl
          # patch of the real queue URL and crash-looping worker with QueueDoesNotExist —
          # confirmed happening twice for real. SQS_QUEUE_URL_DEV is a repo *variable* (not a
          # secret — the URL isn't sensitive on its own), set once from `terraform output
          # queue_url` in environments/dev.
          if [ -z "${{ vars.SQS_QUEUE_URL_DEV }}" ]; then
            echo "::error::SQS_QUEUE_URL_DEV repo variable is not set" >&2
            exit 1
          fi
          SED_ARGS+=(-e "s#REPLACE_WITH_TERRAFORM_OUTPUT_queue_url#${{ vars.SQS_QUEUE_URL_DEV }}#g")
          kubectl kustomize . | sed "${SED_ARGS[@]}" > /tmp/rendered.yaml
          kubectl apply -f /tmp/rendered.yaml
      - name: Smoke test
        run: bash kubernetes/dev/smoke-test.sh dev dev.testscope.local
