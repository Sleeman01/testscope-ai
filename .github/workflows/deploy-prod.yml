name: Deploy Prod
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Same fix as deploy-dev.yml: repo's default_workflow_permissions is "read" (confirmed
    # via the Actions API), so GITHUB_TOKEN needs packages: write declared explicitly here or
    # `docker push` fails with "installation not allowed to Create organization package".
    # contents: read must be listed too — declaring `permissions:` resets every unlisted
    # scope to none for this job, which would otherwise break actions/checkout below.
    # Scoped to this job only, not the deploy job (never pushes packages).
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend/api
            image: api
          - service: backend/worker
            image: worker
          - service: mcp-server
            image: mcp-test-analysis
          - service: frontend
            image: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          # ghcr.io (like all OCI registries) requires an all-lowercase repository name;
          # github.repository_owner preserves the GitHub username's actual casing
          # (Sleeman01), which docker build/push reject outright ("repository name must be
          # lowercase"). Lowercase once here rather than hardcoding the owner literally, so
          # this keeps working if the repo is ever renamed or forked under a different owner.
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${OWNER_LC}/testscope-${{ matrix.image }}:${{ github.ref_name }} -f ${{ matrix.service }}/Dockerfile .
          docker push ghcr.io/${OWNER_LC}/testscope-${{ matrix.image }}:${{ github.ref_name }}

  deploy:
    needs: [build-and-push]
    runs-on: [self-hosted, testscope-k8s]
    environment: production  # requires a manual reviewer approval, configured once in repo Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - name: Update image tags and apply
        shell: bash
        # Same fix as deploy-dev.yml: chain all four sed substitutions over a single
        # `kubectl kustomize .` render instead of re-rendering (and overwriting the previous
        # image's substitution) on every loop iteration — see that workflow's comment for the
        # empirical confirmation of the bug this replaces.
        run: |
          cd kubernetes/prod
          # Same lowercasing as build-and-push's own step above — ghcr.io tags must be
          # all-lowercase; github.repository_owner preserves actual casing (Sleeman01).
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SED_ARGS=()
          for img in api worker mcp-test-analysis frontend; do
            SED_ARGS+=(-e "s#ghcr.io/testscope-ai/${img}:latest#ghcr.io/${OWNER_LC}/testscope-${img}:${{ github.ref_name }}#g")
          done
          # Durability fix: without this, every tagged push re-applies the checked-in
          # REPLACE_WITH_TERRAFORM_OUTPUT_queue_url placeholder, reverting any live kubectl
          # patch of the real queue URL and crash-looping worker with QueueDoesNotExist — same
          # gap confirmed happening twice in dev. SQS_QUEUE_URL_PROD is a repo *variable* (not a
          # secret — the URL isn't sensitive on its own), set once from `terraform output
          # queue_url` in environments/prod.
          if [ -z "${{ vars.SQS_QUEUE_URL_PROD }}" ]; then
            echo "::error::SQS_QUEUE_URL_PROD repo variable is not set" >&2
            exit 1
          fi
          SED_ARGS+=(-e "s#REPLACE_WITH_TERRAFORM_OUTPUT_queue_url#${{ vars.SQS_QUEUE_URL_PROD }}#g")
          kubectl kustomize . | sed "${SED_ARGS[@]}" > /tmp/rendered.yaml
          kubectl apply -f /tmp/rendered.yaml
      - name: Smoke test
        run: bash kubernetes/prod/smoke-test.sh prod testscope.local
