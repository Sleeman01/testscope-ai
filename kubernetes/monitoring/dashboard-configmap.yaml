apiVersion: v1
kind: ConfigMap
metadata:
  name: testscope-dashboard
  namespace: monitoring
  # No `grafana_dashboard: "1"` label: that's the kube-prometheus-stack sidecar-discovery
  # convention, and Task 40's Grafana Deployment doesn't run that sidecar. This ConfigMap
  # is mounted directly at /etc/grafana/dashboards/testscope.json instead (Task 40's
  # grafana-dashboard-provider ConfigMap tells Grafana to load JSON files from there).
data:
  # Task 41, panel-by-panel cross-check against the metrics actually declared/incremented
  # in backend/shared/metrics.py and mcp-server/mcp_metrics.py (not assumed from
  # design.md/plan.md text alone):
  #
  # - API Request Rate: testscope_api_requests_total{method,path,status} (API_REQUEST_COUNT,
  #   backend/shared/metrics.py) -- incremented on every request via backend/api/api_app/main.py's
  #   middleware (Task 39). `by (status)` is valid: status is a declared label. OK.
  # - Analysis Success/Fail Rate: testscope_analyses_total{status} (ANALYSIS_COUNT) --
  #   incremented once per terminal outcome in backend/worker/worker_app/runner.py's finally block
  #   (moved there from report_saver.py in commit 967acc5, specifically so this label can
  #   show both "completed" and "failed" -- before that fix, report_saver unconditionally
  #   set status="completed" and this panel could never show a failure). OK.
  # - Analysis Duration (p50/p95): testscope_analysis_duration_seconds_bucket
  #   (ANALYSIS_DURATION, an unlabeled Histogram) -- Prometheus's Histogram always emits the
  #   `le` bucket label regardless of any custom labelnames, so `by (le)` is valid even
  #   though ANALYSIS_DURATION itself declares no labels. Observed in runner.py's finally
  #   block. OK.
  # - MCP Tool Latency by Tool: testscope_mcp_tool_duration_seconds_bucket{tool}
  #   (MCP_TOOL_LATENCY) -- same name+label declared independently in both
  #   backend/shared/metrics.py (worker's app/mcp_clients.py._call) and
  #   mcp-server/mcp_metrics.py (server.py's @instrument_tool-wrapped tools); Prometheus
  #   differentiates the two processes by scrape-target labels, not metric name, so both
  #   contribute to the same query. `by (le, tool)` valid. OK.
  # - MCP Tool Errors by Tool: testscope_mcp_tool_calls_total{tool,status="error"}
  #   (MCP_TOOL_CALL_COUNT) -- both worker's _call and mcp-server's instrument_tool set the
  #   literal string status="error" on exception (and "success" otherwise) -- confirmed
  #   exact string match against both instrumentation sites, not assumed. OK.
  # - Pod Restarts: kube_pod_container_status_restarts_total{namespace} -- NOT covered by
  #   this cross-check, because it isn't one of ours: this is a kube-state-metrics metric,
  #   and kube-state-metrics is not deployed anywhere in this project (not in Task 40's
  #   manifests, not listed in design.md §12's stack -- "Prometheus + Grafana + Loki/
  #   Promtail" -- and Task 40's own scrape config only discovers pods whose `app` label
  #   matches api|worker|mcp-test-analysis|mcp-github, which a kube-state-metrics pod
  #   wouldn't anyway). This panel will read "No data" until/unless kube-state-metrics is
  #   deployed as its own, separately-scoped addition -- flagged, not fixed here, same as
  #   the already-flagged mcp-github probe/scrape gaps.
  # - Recent Failed Analyses (logs): post-Phase-11 hardening item 3. LogQL now
  #   `| json | status="failed"` against Loki, matching backend/shared/logging_utils.py's
  #   JsonLogFormatter (mirrored locally as mcp-server/mcp_logging.py, same reasoning as
  #   mcp_metrics.py -- mcp-server can't depend on backend/shared) -- every JSON log line
  #   this formatter emits that includes a `status` field is a real top-level JSON key, so
  #   Loki's `| json` parser stage extracts it directly rather than the old literal-substring
  #   match (`|= "status=failed"`), which nothing ever emitted. Wired into worker_app (10
  #   real failure-path logger.exception/.warning call sites now carry status="failed" plus
  #   whichever of analysis_id/repository/issue_number/node/tool/duration/error_type
  #   genuinely apply at that call site -- non-fatal/non-terminal warnings deliberately omit
  #   `status`, e.g. requirement_retriever's comments-fetch fallback), api_app, and
  #   mcp-server's real entrypoints -- but api_app and mcp-server currently have zero
  #   application-level logger.* calls of their own (their errors either become HTTPExceptions
  #   or propagate back to worker_app's own call sites, which already log them), so the
  #   formatter is correctly wired there but has nothing to emit yet.
  #   request_id (design.md §12's field list) has no source anywhere in this codebase -- no
  #   per-API-request or per-job correlation ID beyond analysis_id exists -- so it's a
  #   supported-but-always-absent field, not fabricated. retry_count is the same: retry.py's
  #   with_retry() doesn't return how many attempts it actually made, so no call site can
  #   honestly populate it without changing that function's contract -- left out rather than
  #   guessed (e.g. hardcoding 3, which would be wrong for a terminal/non-retryable error
  #   that fails on the first attempt).
  #   mcp-github/auth-proxy is stock nginx (official image, templated config, no app code in
  #   this repo) -- not a Python service, nothing to apply a logging.Formatter to; skipped.
  #   Separately, real bug found while verifying this: promtail.yaml's scrape_config never
  #   attached a `namespace` label to anything (static_configs + a bare /var/log/pods glob,
  #   no pipeline_stages) -- `{namespace=~"dev|prod"}` would have matched zero streams
  #   regardless of the logging-format fix above. Fixed there (cri + regex + labels stages),
  #   see that file's own header comment.
  testscope.json: |
    {
      "title": "TestScope AI — System Health",
      "panels": [
        { "title": "API Request Rate", "type": "timeseries", "targets": [{ "expr": "sum(rate(testscope_api_requests_total[5m])) by (status)" }] },
        { "title": "Analysis Success/Fail Rate", "type": "timeseries", "targets": [{ "expr": "sum(rate(testscope_analyses_total[15m])) by (status)" }] },
        { "title": "Analysis Duration (p50/p95)", "type": "timeseries", "targets": [
          { "expr": "histogram_quantile(0.50, sum(rate(testscope_analysis_duration_seconds_bucket[15m])) by (le))" },
          { "expr": "histogram_quantile(0.95, sum(rate(testscope_analysis_duration_seconds_bucket[15m])) by (le))" }
        ]},
        { "title": "MCP Tool Latency by Tool", "type": "timeseries", "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(testscope_mcp_tool_duration_seconds_bucket[15m])) by (le, tool))" }] },
        { "title": "MCP Tool Errors by Tool", "type": "timeseries", "targets": [{ "expr": "sum(rate(testscope_mcp_tool_calls_total{status=\"error\"}[15m])) by (tool)" }] },
        { "title": "Pod Restarts", "type": "timeseries", "targets": [{ "expr": "sum(kube_pod_container_status_restarts_total{namespace=~\"dev|prod\"}) by (pod)" }] },
        { "title": "Recent Failed Analyses (logs)", "type": "logs", "datasource": "Loki", "targets": [{ "expr": "{namespace=~\"dev|prod\"} | json | status=\"failed\"" }] }
      ]
    }
