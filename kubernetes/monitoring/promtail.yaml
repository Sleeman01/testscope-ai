apiVersion: v1
kind: ConfigMap
metadata: { name: promtail-config, namespace: monitoring }
data:
  # Task 40, real bug found and fixed: plan.md's own promtail.yaml snippet passes
  # -config.file=/etc/promtail/config.yml as a container arg but never defines that file
  # anywhere (no ConfigMap, no volumeMount at /etc/promtail) — promtail's -config.file flag
  # is mandatory, so the container as originally specified would fail to start at all.
  # Confirmed structurally from the YAML itself (no live cluster needed): no resource in
  # the plan's snippet ever provides that path. Minimal config here scrapes the same
  # /var/log/pods hostPath already mounted below (standard per-pod-per-container log
  # layout under kubeadm/containerd) and pushes to the same Loki URL already passed via
  # -client.url (kept for parity with the plan's literal args, though this config's own
  # clients: entry is what promtail actually uses).
  #
  # Post-Phase-11 hardening item 3, real bug found and fixed while verifying the
  # dashboard's "Recent Failed Analyses" panel: the scrape_config above only ever attached
  # one static label (`job: varlogs`) — no `namespace`, `pod`, or `container` label existed
  # anywhere on these streams, since static_configs + a bare __path__ glob doesn't parse
  # kubelet's own /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log directory
  # convention on its own. The dashboard's `{namespace=~"dev|prod"}` selector (every panel
  # in this ConfigMap, not just the logs one) would therefore have matched zero streams,
  # independent of the logging-format fix in dashboard-configmap.yaml. Added the
  # pipeline_stages below: `cri` unwraps containerd's own log-line wrapper (this cluster
  # uses containerd — confirmed via terraform/modules/ec2/cloud-init-control-plane.yaml.tpl
  # — not Docker's json-file format, so `cri`, not `docker`, is the correct stage) down to
  # the application's raw stdout line, which Loki's `| json` parser stage then needs to see
  # unprefixed; `regex` extracts namespace/pod/container from the well-known kubelet path
  # convention via Promtail's standard `source: filename` idiom (the file-target's own
  # `filename` label is seeded into the pipeline's extracted-fields map before any stage
  # runs, precisely to enable this); `labels` promotes the two fields the dashboard actually
  # queries on into real Loki labels (pod_name dropped — high-cardinality, unused by any
  # panel here).
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets: [localhost]
            labels:
              job: varlogs
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<pod_uid>[^/]+)/(?P<container>[^/]+)/'
          - labels:
              namespace:
              container:
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: promtail, namespace: monitoring }
spec:
  selector: { matchLabels: { app: promtail } }
  template:
    metadata: { labels: { app: promtail } }
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.2.0
          args: ["-config.file=/etc/promtail/config.yml", "-client.url=http://loki:3100/loki/api/v1/push"]
          volumeMounts:
            - { name: varlog, mountPath: /var/log/pods, readOnly: true }
            - { name: config, mountPath: /etc/promtail }
      volumes:
        - name: varlog
          hostPath: { path: /var/log/pods }
        - name: config
          configMap: { name: promtail-config }
