apiVersion: v1
kind: ConfigMap
metadata:
  name: testscope-config
data:
  ENV: "prod"
  DYNAMODB_TABLE: "testscope-analyses-prod"
  S3_BUCKET: "testscope-reports-prod"
  # kustomize's plain ConfigMap patch can't read a live Terraform output automatically — after
  # `terraform apply` in terraform/environments/prod, run `terraform output queue_url` there and
  # paste the result in below before applying this overlay.
  SQS_QUEUE_URL: "REPLACE_WITH_TERRAFORM_OUTPUT_queue_url"
