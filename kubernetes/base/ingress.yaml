apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testscope-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: REPLACED_BY_OVERLAY  # dev.testscope.local / testscope.local, see Task 35
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
