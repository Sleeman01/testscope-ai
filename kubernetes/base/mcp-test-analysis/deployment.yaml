apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-test-analysis
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-test-analysis } }
  template:
    metadata:
      labels: { app: mcp-test-analysis }
      # Task 40, real bug found and fixed (not in plan.md's own Task 40 scrape-config
      # snippet, which relies on Prometheus's default first-declared-containerPort
      # behavior): this pod declares TWO ports (8100 MCP transport, 8101 health/metrics),
      # and Prometheus's kubernetes_sd_configs (role: pod) would otherwise scrape podIP:8100
      # by default — the streamable-HTTP MCP transport, not the FastAPI app Task 39 mounted
      # /metrics on. Explicit port override so the correct one (8101) gets scraped.
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8101" }
    spec:
      containers:
        - name: mcp-test-analysis
          image: ghcr.io/testscope-ai/mcp-test-analysis:latest
          ports: [{ containerPort: 8100 }, { containerPort: 8101 }]
          env:
            - name: WORKSPACE_ROOT
              value: /workspace
            - name: MCP_GITHUB_URL
              value: http://mcp-github:8100/mcp
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: github-token, key: token } }
          envFrom: [{ configMapRef: { name: testscope-config } }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: workspace, mountPath: /workspace }]
          livenessProbe: { httpGet: { path: /health/live, port: 8101 }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: 8101 }, initialDelaySeconds: 5, periodSeconds: 10 }
      volumes:
        - name: workspace
          emptyDir: { sizeLimit: 2Gi }
