server {
    listen 80;
    root /usr/share/nginx/html;
    # api's health routes are mounted bare (/health/live, /health/ready — no /api prefix,
    # see design.md §7), unlike /api/analyses which already includes /api in its own route.
    # location /api/ below has no URI after the upstream (proxy_pass http://api:8000;), so
    # nginx forwards the request URI unchanged — correct for /api/analyses, but it means
    # /api/health/live would reach api as literal /api/health/live, which doesn't exist.
    # This more specific location strips the /api prefix just for the health paths so
    # Task 37/38's smoke test (curl .../api/health/live) actually reaches a real route.
    location /api/health/ { proxy_pass http://api:8000/health/; }
    location /api/ { proxy_pass http://api:8000; }

    # Vite's build output hashes every filename by content (e.g. index-Dtjc1B0f.js), so a
    # new build always produces new filenames — safe to cache these indefinitely. `always`
    # so the header is still set on non-200s (e.g. a 404 for a removed old-hash asset isn't
    # itself cached indefinitely by a client that doesn't know better).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the one filename that never changes across deploys — its own cache
    # policy is what actually determines whether a client picks up a new deploy at all.
    # Previously had no explicit Cache-Control (nginx's static-file default only sends
    # ETag/Last-Modified), which left it open to undefined heuristic caching by browsers —
    # confirmed root cause of a real incident where a browser kept rendering an old build
    # (with stale hashed asset references) well after the pod had already deployed the new
    # one. Must never be cached, or clients can get stuck on an old build indefinitely.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }
}
