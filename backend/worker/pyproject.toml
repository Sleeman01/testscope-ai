# Local dev install order (backend/shared is a path dependency, not listed below):
#   pip install -e ../shared && pip install -e ../shared[dev] && pip install -e ".[dev]"

[project]
name = "testscope-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2", "anthropic>=0.39", "mcp>=1.1", "boto3>=1.35", "fastapi>=0.115", "uvicorn[standard]>=0.32", "prometheus-client>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "moto[s3,dynamodb,sqs]>=5.0", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Task 13 introduces app/nodes/test_search_planner.py, test_file_retriever.py, and
# test_file_classifier.py — real node modules, not test files, but their names match
# pytest's default test_*.py discovery glob. Without this, `python -m pytest` (run from
# backend/worker/, as every task in the plan does) recursively collects them too and
# tries to run e.g. test_search_planner(state) itself as a test function. Scoping
# discovery to tests/ only fixes it without renaming the node files plan.md specifies.
testpaths = ["tests"]
