[project]
name = "testscope-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35", "pydantic>=2.9", "pydantic-settings>=2.6", "prometheus-client>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "moto[s3,dynamodb,sqs]>=5.0", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "dynamodb", "metrics", "models", "s3", "sqs"]
