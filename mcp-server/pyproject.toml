[project]
name = "testscope-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3.0", "boto3>=1.35", "GitPython>=3.1", "fastapi>=0.115", "uvicorn[standard]>=0.32", "prometheus-client>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "moto[s3,dynamodb,sqs]>=5.0", "ruff>=0.7"]

[tool.setuptools]
py-modules = ["aws", "github_client", "mcp_metrics", "server", "sweeper", "workspace"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
