# docker-compose.yml — Task 43 (Phase 10): full local stack, LocalStack standing in for AWS.
#
# Required before `docker compose up`:
#   ANTHROPIC_API_KEY — real Claude API key. Only `worker` uses it, and only for the one
#                        deliberate live LLM call this stack makes (design.md's stated
#                        exception to "never call the real Claude API from automated tests" —
#                        this is a manual local run, not CI).
#   GITHUB_PAT         — real, narrowly-scoped, read-only GitHub PAT (repo/public_repo read
#                        access is enough; this stack never writes to GitHub). Consumed only
#                        by the mcp-github-upstream/mcp-github pair below — never by worker,
#                        api, or mcp-test-analysis directly (see the mcp-github comment).
#
# Neither is read from this file directly — export both in the shell that runs
# `docker compose up`, or put them in a gitignored `.env` file in this directory (already
# covered by .gitignore's `.env`/`.env.*` patterns); docker compose loads that automatically.
# Never commit a real value for either.
services:
  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=s3,dynamodb,sqs
      - DEFAULT_REGION=us-east-1
    ports: ["4566:4566"]

  localstack-init:
    image: amazon/aws-cli:2.18.0
    # depends_on a plain container-started condition (the plan's literal snippet) races
    # LocalStack's own startup — confirmed via a real run: `localstack-init` reached the
    # `aws` calls before LocalStack's services were actually listening and exited 255
    # ("Could not connect to the endpoint URL"). localstack/localstack:3.8 ships its own
    # HEALTHCHECK (`localstack status services`); keying depends_on off that instead is the
    # idiomatic Compose fix, not a custom retry loop.
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: /bin/sh
    # `&&`-chained with no existence check (the plan's literal snippet) isn't safe to re-run:
    # confirmed via a real run — `localstack` itself has no declared volume, so its data only
    # resets on a real `docker compose down` (not a plain `up -d --build` re-run after fixing
    # an unrelated port), and a second `localstack-init` pass then hit `ResourceInUseException`
    # on the very first command and (via `&&`) never reached the bucket/queue steps at all.
    # `|| true` per step makes every step idempotent against its own "already exists" case
    # without masking the create attempt itself — appropriate for this local-dev-only
    # convenience script; not applied to anything AWS-account-facing elsewhere in the repo.
    command: >
      -c "
      aws --endpoint-url=http://localstack:4566 dynamodb create-table --table-name testscope-analyses-local --attribute-definitions AttributeName=analysis_id,AttributeType=S --key-schema AttributeName=analysis_id,KeyType=HASH --billing-mode PAY_PER_REQUEST || true;
      aws --endpoint-url=http://localstack:4566 s3 mb s3://testscope-reports-local || true;
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name testscope-jobs-local || true
      "
    environment: [AWS_ACCESS_KEY_ID=test, AWS_SECRET_ACCESS_KEY=test, AWS_DEFAULT_REGION=us-east-1]

  mcp-test-analysis:
    build: { context: ., dockerfile: mcp-server/Dockerfile }
    environment:
      - WORKSPACE_ROOT=/workspace
      - DYNAMODB_TABLE=testscope-analyses-local
      - S3_BUCKET=testscope-reports-local
      - MCP_GITHUB_URL=http://mcp-github:8100/mcp
      - GITHUB_TOKEN=local-dev-unused
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on: [localstack-init]
    ports: ["8100:8100"]

  # --- mcp-github, split into two services (deviation from the plan's literal single-service
  # snippet — decided in chat, not silently applied): the official github-mcp-server image's
  # http mode requires a per-request `Authorization: Bearer <token>` header and ignores
  # GITHUB_PERSONAL_ACCESS_TOKEN for inbound auth (confirmed live, Task 8/Phase 7 — the same
  # gap Task 33 closed for Kubernetes with an nginx auth-proxy sidecar). docker-compose has no
  # pod-equivalent "two containers, one network namespace" primitive, so the sidecar becomes
  # its own service instead, fronting a second, internal-only service running the real image.
  # worker/api/mcp-test-analysis all still address `http://mcp-github:8100/mcp` unchanged —
  # that name now resolves to the proxy, exactly mirroring how the k8s Service object always
  # pointed at the sidecar, not the real container, transparently to every caller.
  mcp-github-upstream:
    image: ghcr.io/github/github-mcp-server:latest
    command: ["http", "--port", "8101", "--listen-host", "0.0.0.0"]
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}

  mcp-github:
    image: nginx:1.27-alpine
    depends_on: [mcp-github-upstream]
    environment:
      - GITHUB_TOKEN=${GITHUB_PAT}
    volumes:
      - ./docker/mcp-github-auth-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports: ["8101:8100"]

  worker:
    build: { context: ., dockerfile: backend/worker/Dockerfile }
    environment:
      - DYNAMODB_TABLE=testscope-analyses-local
      - S3_BUCKET=testscope-reports-local
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/testscope-jobs-local
      - MCP_GITHUB_URL=http://mcp-github:8100/mcp
      - MCP_TEST_ANALYSIS_URL=http://mcp-test-analysis:8100/mcp
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Missing from the plan's literal Task 43 snippet — real bug, found by actually running
      # the smoke test: requirement_retriever.py's issue-body fetch bypasses MCP entirely
      # (design.md §5.2's standing decision) and calls os.environ["GITHUB_TOKEN"] directly
      # against real api.github.com, unrelated to the mcp-github auth-proxy above. Without
      # this, the very first analysis submitted fails immediately
      # (`Could not fetch issue body: 'GITHUB_TOKEN'`, a raw KeyError). Needs the real PAT,
      # not a placeholder, since this call reaches real github.com per the accepted Task 43
      # scope change — same credential, reused, not a second secret.
      - GITHUB_TOKEN=${GITHUB_PAT}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on: [localstack-init, mcp-test-analysis, mcp-github]
    # Host-side port remapped 8080 -> 8081 (container-internal port unchanged): this dev
    # machine already has an unrelated project bound to host 0.0.0.0:8080
    # (`polyaifursa-yolo-1`), same class of conflict as api's/frontend's remaps above. Nothing
    # in this compose network or the smoke test script addresses `worker` by its host port —
    # only its own health/metrics endpoint is published here, for host-side debugging.
    ports: ["8081:8080"]

  api:
    build: { context: ., dockerfile: backend/api/Dockerfile }
    environment:
      - DYNAMODB_TABLE=testscope-analyses-local
      - S3_BUCKET=testscope-reports-local
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/testscope-jobs-local
      - MCP_GITHUB_URL=http://mcp-github:8100/mcp
      - MCP_TEST_ANALYSIS_URL=http://mcp-test-analysis:8100/mcp
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on: [localstack-init]
    # Host-side port remapped 8000 -> 8001 (container-internal port unchanged): this dev
    # machine already has an unrelated project bound to host 0.0.0.0:8000
    # (`polyaifursa-agent-1`), confirmed via `docker ps -a`/`docker compose up`'s own bind
    # error — not a stale leftover from this project. Nothing inside the compose network
    # references this host mapping (worker/frontend reach `api` via the internal
    # `api:8000` service DNS name, unaffected), so only the host-facing smoke test script
    # needed updating to match.
    ports: ["8001:8000"]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    # Host-side port remapped 3000 -> 3002 (container-internal nginx port unchanged): this
    # dev machine already has an unrelated project bound to host 0.0.0.0:3000
    # (`polyaifursa-frontend-1`) *and* 0.0.0.0:3001 (`polyaifursa-grafana-1`) — 3002 confirmed
    # free against the full current port listing before use.
    ports: ["3002:80"]
    depends_on: [api]
